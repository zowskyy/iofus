name: Update visual baselines

# Manually-triggered only: regenerates the visual regression suite's
# screenshot baselines on the same OS/font stack CI actually runs on
# (ubuntu-latest), then commits them straight back to the branch that
# triggered the run. Locally-captured baselines (Windows/Mac) render text
# with different system fonts than CI's Ubuntu box, so every screenshot
# comparison fails there even when nothing visual actually regressed —
# this job exists to make CI compare against baselines from its own
# environment instead.
on:
  workflow_dispatch: {}

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Regenerate visual regression baselines
        run: npm run test:e2e:visual -- --update-snapshots

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "Regenerate visual regression baselines on ubuntu-latest

Locally-captured baselines don't match CI's font rendering; this
recaptures them in the exact environment CI compares against.

Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            git push
          fi
