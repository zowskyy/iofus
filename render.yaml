# Render Blueprint for iofus.
#
# The database is a single SQLite file, so two things about this service are
# not incidental and should not be "optimized" later:
#
#   * A disk is required. Render's filesystem is otherwise ephemeral -- every
#     account, page, guestbook entry and message would be destroyed on each
#     deploy. The app refuses to start if IOFUS_DB_PATH is not on a mounted
#     volume, so a missing disk fails the deploy instead of losing data
#     quietly. Disks need a paid instance type; free instances cannot have one.
#
#   * A disk pins the service to a single instance and disables zero-downtime
#     deploys: Render stops the old instance before starting the new one. That
#     is what keeps two processes from ever writing the same SQLite file, and
#     it costs a few seconds of downtime per deploy. Scaling past one instance
#     means moving off SQLite first.
services:
  - type: web
    name: iofus
    runtime: docker
    plan: starter # a disk requires a paid instance type
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    healthCheckPath: /api/health

    disk:
      name: iofus-data
      mountPath: /data
      sizeGB: 1

    envVars:
      # Must sit inside the disk's mountPath above.
      - key: IOFUS_DB_PATH
        value: /data/iofus.db

      # Canonical origin for reset links, sitemap URLs and exported pages.
      # Never derived from request headers, which a client controls.
      - key: IOFUS_ALLOWED_ORIGIN
        sync: false

      # How many proxies append to X-Forwarded-For in front of this service.
      # MEASURE IT, do not guess: deploy, then open /api/_diag/ip as a
      # moderator and pick the hop count whose `wouldResolveTo` is your own
      # address. Too low keys rate limits off a value the client can forge;
      # too high puts every visitor in one shared bucket. Both fail silently.
      - key: IOFUS_TRUSTED_PROXY_HOPS
        sync: false

      # Handle of the account to promote to moderator. Without it no moderator
      # can ever exist and the report and appeal queues are unactionable.
      - key: IOFUS_MODERATOR_HANDLE
        sync: false

      # Password reset and email change are undeliverable without these, so
      # the app refuses to start rather than log live reset tokens.
      - key: IOFUS_SMTP_HOST
        sync: false
      - key: IOFUS_SMTP_PORT
        sync: false
      - key: IOFUS_SMTP_USER
        sync: false
      - key: IOFUS_SMTP_PASS
        sync: false
      - key: IOFUS_SMTP_FROM
        sync: false
